# solo-dm on the tailnet, and nowhere else.
#
# Two containers: Tailscale joins the tailnet as the machine "solo-dm" and
# forwards https://solo-dm.<tailnet>.ts.net to the game; the game shares its
# network and listens on 127.0.0.1 only. No port is published on the host.
#
# Before the first `docker compose up -d --build`:
#   .env.tailscale  TS_AUTHKEY=tskey-auth-...  (an auth key from the Tailscale
#                   admin console; after the first login the state volume keeps
#                   the machine logged in, so the key can be removed)
#   .env.solo_dm    ANTHROPIC_API_KEY=...      (mounted read-only, never in the image)
# Both files are gitignored (.env*) and kept out of the image (.dockerignore).

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: solo-dm
    env_file:
      - path: .env.tailscale
        required: false   # only needed for the first login
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    restart: unless-stopped

  solo-dm:
    build: .
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - campaigns:/app/campaigns
      - logs:/app/logs
      - ./.env.solo_dm:/app/.env.solo_dm:ro
    restart: unless-stopped

volumes:
  tailscale-state:
  campaigns:
  logs:
