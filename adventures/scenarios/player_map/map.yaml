# The map of the player_map scenario, in the map.yaml convention of
# dnd-adventures (see revenge_of_azzinax/map.yaml). The image is drawn by
# scripts in this repo; it is not from a book.
image: player_map.png
player_image: player_map.png
cell_px: 20
locations:
  hall:
    cells: [[1, 1, 3, 4]]
    openings:
      - {id: hall_a, kind: door, direction: east, at: [90, 50], meets: passage_a}
  passage:
    cells: [[5, 2, 6, 2]]
    openings:
      - {id: passage_a, kind: door, direction: west, at: [90, 50], meets: hall_a}
      - {id: passage_b, kind: archway, direction: east, at: [140, 50], meets: vault_a}
  vault:
    cells: [[7, 1, 8, 4]]
    openings:
      - {id: vault_a, kind: archway, direction: west, at: [140, 50], meets: passage_b}
