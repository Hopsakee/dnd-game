# Scenario: challenges and the ability-check fallback (plan 3.7). Talking the
# goblin out of the way is a challenge: any attempt rolls its Charisma
# (Persuasion) check, with the DC Python sets (medium 15, indifferent +0); the
# adventure says what success does.
id: ability_check
title: The Gatekeeper
start_location: gate
win_condition: {flag: passage_granted}
locations:
  - id: gate
    name: Gate
    description: >-
      A rusted gate in a cliff wall. A goblin leans on a spear in front of it,
      bored. The cliff is sheer but cracked; the road runs back south.
    exits: [{id: gate_to_road, to: road, direction: south}]
    checks:
      - {id: climb_cliff, goal: climb the cracked cliff, ability: STR, skill: athletics,
         on_success: {set_flag: cliff_climbed}}
  - id: road
    name: Road
    description: A muddy road leading away from the cliffs.
    exits: [{id: road_to_gate, to: gate, direction: north}]
entities:
  - id: gatekeeper
    srd_ref: goblin_warrior
    location: gate
    attitude: indifferent
    checks:
      - {id: get_past_gatekeeper, goal: get the gatekeeper to let you through the gate,
         ability: CHA, skill: persuasion, on_success: {set_flag: passage_granted}}
