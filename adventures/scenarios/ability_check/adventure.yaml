# Scenario: the ability-check fallback (plan 3.7). No rule covers talking a
# goblin out of the way; the interpreter proposes a Charisma check, Python sets
# the DC (medium 15, indifferent +0) and the adventure says what success does.
id: ability_check
title: The Gatekeeper
start_location: gate
win_condition: {flag: passage_granted}
locations:
  - id: gate
    name: Gate
    description: >-
      A rusted gate in a cliff wall. A goblin leans on a spear in front of it,
      bored. The cliff is sheer but cracked; the road runs back south.
    exits: [{id: gate_to_road, to: road, direction: south}]
    checks:
      - {ability: STR, skill: athletics, on_success: {set_flag: cliff_climbed}}
  - id: road
    name: Road
    description: A muddy road leading away from the cliffs.
    exits: [{id: road_to_gate, to: gate, direction: north}]
entities:
  - id: gatekeeper
    srd_ref: goblin_warrior
    location: gate
    attitude: indifferent
    checks:
      - {ability: CHA, skill: persuasion, on_success: {set_flag: passage_granted}}
