[project]
name = "solo-dm"
version = "0.1.0"
description = "Solo D&D 5e engine: deterministic Python rules, LLM interpreter and narrator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
    "rich>=15.0.0",
    "anthropic>=2.6.0",
    "python-fasthtml>=0.14.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
solo-dm = "solo_dm.composition_root:main"
# M8: converting a book, called by the adventure-converter agent.
adventure-ingest = "adventure_ingest.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]
# M8 ingestion only: kept out of the game's Docker image (--no-default-groups).
ingest = [
    "pymupdf4llm>=1.28",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["solo_dm", "adventure_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real model; run only with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# The box's wheel store has Linux wheels only, so the lock covers Linux for now.
# Running on the Mac mini (decided at M6) needs a darwin entry and a relock there.
environments = ["sys_platform == 'linux'"]
default-groups = ["dev", "ingest"]
