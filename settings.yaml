# solo-dm settings. No secrets here: an API key, if any, goes in .env.solo_dm
# (gitignored, outside the box only). See BUILD_PLAN.md 3.9.
llm:
  provider: anthropic       # anthropic | fake (the keyword model, no network, no cost)
  model: claude-haiku-5-5
  # Where to send model calls. null: the URL in the environment variable below if
  # it is set (in the box: the credential broker, which adds the key), otherwise
  # api.anthropic.com with ANTHROPIC_API_KEY from .env.solo_dm.
  base_url: null
  base_url_env: ANTHROPIC_API_BASE
  broker_auth_file: /run/broker/caller   # sent as X-Hoggle-Broker-Auth when present
  # Per role. max_tokens counts thinking too. Haiku 5.5 takes no temperature.
  interpreter: {max_tokens: 2048, effort: low}
  narrator: {max_tokens: 4096, effort: medium}   # model: claude-sonnet-5-5 to try Sonnet
paths:
  adventures: adventures
  # The books (M7): the private repo dnd-adventures, cloned next to this one.
  # Skipped when it is not there. In Docker, compose.yaml mounts it there.
  extra_adventures: [../dnd-adventures]
  srd: srd
  lore: lore
  campaigns: campaigns
  llm_call_log: logs/llm_calls.jsonl
cost:
  daily_cap_usd: 1.00       # refuse new model calls above this; null = no cap
